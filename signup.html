<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hapo Technology • Parent Register</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navigation Header -->
  <nav class="nav-header-new">
    <div class="nav-container-new">
      <div class="nav-brand-new">
        <img src="src/lib/images/logo.jpg" alt="Hapo Logo" class="logo-new">
        <div class="brand-content-new">
          <span class="brand-name-new">Hapo Technology</span>
          <span class="brand-tagline-new">Your Money, Your Growth, The Hapo Way!</span>
        </div>
      </div>
      <div class="nav-actions-new">
        <button class="student-login-btn-new" onclick="window.location.href='index.html'">Back to Home</button>
        <button class="parent-signup-btn-new" onclick="window.location.href='parentLogin.html'">Sign In</button>
      </div>
    </div>
  </nav>

  <!-- Register Card -->
  <main class="auth-wrap">
    <section class="auth-card">
      <h1 class="auth-title">Parent Register</h1>
      <p class="auth-subtitle">Create your Hapo account to manage your family's finances</p>

      <form class="auth-form" id="parent-signup-form">
        <div class="field">
          <label for="firstName">First Name</label>
          <input id="firstName" name="firstName" type="text" class="input" placeholder="Phelo" required>
        </div>

        <div class="field">
          <label for="surname">Surname</label>
          <input id="surname" name="surname" type="text" class="input" placeholder="Madala" required>
        </div>

        <div class="field">
          <label for="mobile">Mobile Number</label>
          <div class="phone-row">
            <select id="countryCode" name="countryCode" class="select code-select" aria-label="Country code" onchange="updateCurrencyFromPhone()">
              <option value="ZA" data-currency="ZAR" selected>ZA +27</option>
              <option value="US" data-currency="USD">US +1</option>
              <option value="GB" data-currency="GBP">UK +44</option>
              <option value="NG" data-currency="NGN">NG +234</option>
              <option value="KE" data-currency="KES">KE +254</option>
              <option value="IN" data-currency="INR">IN +91</option>
              <option value="CA" data-currency="CAD">CA +1</option>
              <option value="AU" data-currency="AUD">AU +61</option>
              <option value="DE" data-currency="EUR">DE +49</option>
              <option value="FR" data-currency="EUR">FR +33</option>
            </select>
            <input id="mobile" name="mobile" type="tel" inputmode="numeric" class="input phone-input" placeholder="123456789" required>
          </div>
        </div>

        <div class="field">
          <label for="defaultCurrency">Default Currency</label>
          <div class="currency-selection">
            <select id="defaultCurrency" name="defaultCurrency" class="select" required>
              <option value="ZAR" data-symbol="R" selected>🇿🇦 South African Rand (R)</option>
              <option value="USD" data-symbol="$">🇺🇸 US Dollar ($)</option>
              <option value="GBP" data-symbol="£">🇬🇧 British Pound (£)</option>
              <option value="EUR" data-symbol="€">🇪🇺 Euro (€)</option>
              <option value="NGN" data-symbol="₦">🇳🇬 Nigerian Naira (₦)</option>
              <option value="KES" data-symbol="KSh">🇰🇪 Kenyan Shilling (KSh)</option>
              <option value="INR" data-symbol="₹">🇮🇳 Indian Rupee (₹)</option>
              <option value="CAD" data-symbol="C$">🇨🇦 Canadian Dollar (C$)</option>
              <option value="AUD" data-symbol="A$">🇦🇺 Australian Dollar (A$)</option>
            </select>
            <div class="currency-note">
              <i class="fas fa-info-circle"></i>
              <span id="currencyNote">Currency auto-selected based on your phone number. You can change this if needed.</span>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" class="input" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="province">Province</label>
          <select id="province" name="province" class="select" required>
            <option value="" disabled selected>Select your province</option>
            <option>Eastern Cape</option>
            <option>Free State</option>
            <option>Gauteng</option>
            <option>KwaZulu-Natal</option>
            <option>Limpopo</option>
            <option>Mpumalanga</option>
            <option>North West</option>
            <option>Northern Cape</option>
            <option>Western Cape</option>
          </select>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" class="input" placeholder="••••••••" required>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" class="input" placeholder="••••••••" required>
        </div>

        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender" name="gender" class="select" required>
            <option value="" disabled selected>Select</option>
            <option>Female</option>
            <option>Male</option>
            <option>Not Specified</option>
          </select>
        </div>

        <label class="checkbox-line">
          <input type="checkbox" id="terms" required>
          <span>I agree to the <a href="#" class="link">Terms &amp; Conditions</a></span>
        </label>

        <button type="submit" class="submit-btn">Create Account</button>
      </form>

      <div class="divider">
        <span>or</span>
      </div>

      <button type="button" class="google-btn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
